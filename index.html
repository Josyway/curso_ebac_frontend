<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="image/github.png" id="avatar" alt=".">
            <h1 class="profile-name"><span id="name"></span></h1>
            <div class="row">
                <div class="col-3"></div>
                <div class="col-6 mt-5 d-flex">
                    <input type="text" class="form-control" placeholder="Nome do usuário" id="login">
                    <button type="button" class="btn btn-success" id="btn-buscar">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
                <div class="col-3"></div>
            </div>
            <h2 class="profile-username"><span id="username"></span></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <a href="#" id="link" class="profile-link">Ver no Github</a>
        </div>
    </header>

    <script src="./js/jquery.js"></script>
    <script src="main.js"></script>
</body>
</html>
